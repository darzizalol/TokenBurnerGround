# budget.conf — the night shift's monthly token allowance.
#
# Sourced by nightshift/budget.sh (shell) and read by token-ledger.py.
# Plain KEY=VALUE, no spaces, no expansion. Edit the numbers here; nothing
# else in the repo hardcodes them.

# The account's total token allowance for one calendar month.
# There is no API that reports this, so it is a human-supplied constant.
MONTHLY_TOKEN_LIMIT=5000000000

# The share of that allowance the night shift may spend in one month.
# When the month's ledger reaches this, the shift stands down until the 1st.
MONTHLY_BUDGET_PCT=35

# Percentage of the *budget* (not the limit) at which the human gets a
# heads-up ping. Fires at most once per month.
WARN_PCT=80
